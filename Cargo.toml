[package]
name = "gorawc"
version = "0.1.0"
edition = "2024"

[dependencies]
# Ассемблер gorawas: кодирование инструкций и запись объектников.
# Тяжёлую и опасную часть (энкодер x86-64) берёт проверенный iced-x86,
# «наше» — фронтенд диалекта и линковка.
iced-x86 = { version = "1", default-features = false, features = ["std", "encoder", "block_encoder", "code_asm", "decoder", "intel"] }
object = { version = "0.36", features = ["read_core", "read", "write", "coff", "pe"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["unbounded_depth"] }
toml = "1.1.6"

[[bin]]
name = "gorawc"
path = "src/main.rs"

[[bin]]
name = "goraw"
path = "src/bin/goraw.rs"

[[bin]]
name = "gorawas"
path = "src/bin/gorawas.rs"

[[bin]]
name = "gorawpb"
path = "src/bin/gorawpb.rs"
