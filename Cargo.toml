[package]
name = "gorawc"
version = "0.1.0"
edition = "2024"

[dependencies]
# Ассемблер gorawas: кодирование инструкций и запись объектников.
# Тяжёлую и опасную часть (энкодер x86-64) берёт проверенный iced-x86,
# «наше» — фронтенд диалекта и линковка.
iced-x86 = { version = "1", default-features = false, features = ["std", "encoder", "block_encoder", "code_asm"] }
object = { version = "0.36", features = ["write", "coff"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
