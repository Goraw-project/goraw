edition = "2023";
package pb2_test;

message SubItem {
  int32 id = 1;
  string title = 2;
}

message ComplexMessage {
  int64 message_id = 1;
  repeated string tags = 2;
  repeated SubItem items = 3;
  map<string, int32> scores = 4;
  oneof payload {
    string text_data = 5;
    int32 code_data = 6;
    SubItem item_data = 7;
  }
}
